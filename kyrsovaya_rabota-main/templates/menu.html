{% extends 'base.html' %}
{% block title %}Меню — Ресторан «Гастроном»{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-header-inner">
        <p class="section-label">Наше меню</p>
        <h1 class="section-title">Каждое блюдо —<br><em style="font-style:italic;font-family:'Cormorant Garamond',serif;">маленький шедевр</em></h1>
        <div class="divider"></div>
    </div>
</div>

<div class="menu-page">
    <div class="menu-sidebar">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-title">Категории</div>
            <ul class="sidebar-nav" id="sidebarNav">
                <li><a href="#all" class="active" data-cat="">Все блюда</a></li>
                {% for cat in categories %}
                <li><a href="#{{ cat }}" data-cat="{{ cat }}">{{ cat }}</a></li>
                {% endfor %}
            </ul>
        </aside>

        <!-- MAIN CONTENT -->
        <div>
            <div class="search-bar">
                <input type="text" class="search-input" id="searchInput" placeholder="Поиск блюда...">
            </div>
            <div id="menuContent"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let allItems = [];

    async function init() {
        const res = await fetch('/api/menu');
        allItems = await res.json();
        renderAll(allItems);
    }

    function renderAll(items) {
        const grouped = {};
        items.forEach(item => {
            if (!grouped[item.category]) grouped[item.category] = [];
            grouped[item.category].push(item);
        });

        const container = document.getElementById('menuContent');
        if (items.length === 0) {
            container.innerHTML = '<div class="no-results">Ничего не найдено</div>';
            return;
        }

        container.innerHTML = Object.entries(grouped).map(([cat, catItems]) => `
            <div class="cat-section" id="section-${encodeURIComponent(cat)}">
                <div class="cat-header">
                    <h2>${cat}</h2>
                    <span class="cat-count">${catItems.length} блюд${catItems.length === 1 ? 'о' : catItems.length < 5 ? 'а' : ''}</span>
                </div>
                <div class="items-list">
                    ${catItems.map(item => `
                        <div class="item-row">
                            <div class="item-name">${item.name}</div>
                            <div class="item-weight">${item.weight || ''}</div>
                            <div class="item-price">${item.price.toLocaleString('ru-RU')}</div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    // Sidebar filter
    document.getElementById('sidebarNav').addEventListener('click', e => {
        const link = e.target.closest('a');
        if (!link) return;
        e.preventDefault();
        document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
        link.classList.add('active');
        const cat = link.dataset.cat;
        const filtered = cat ? allItems.filter(i => i.category === cat) : allItems;
        document.getElementById('searchInput').value = '';
        renderAll(filtered);
    });

    // Search
    document.getElementById('searchInput').addEventListener('input', e => {
        const q = e.target.value.toLowerCase().trim();
        document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
        document.querySelector('.sidebar-nav a[data-cat=""]').classList.add('active');
        const filtered = q ? allItems.filter(i => i.name.toLowerCase().includes(q)) : allItems;
        renderAll(filtered);
    });

    init();
</script>
{% endblock %}
